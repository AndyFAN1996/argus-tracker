name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.7

      - name: Set up npm with Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        run: >-
          node -e "const tag=process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const version=require('./package.json').version;
          if(tag!==version){throw new Error('Release tag '+tag+' does not match package version '+version)}"

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Publish to npm
        run: npm publish --access public
